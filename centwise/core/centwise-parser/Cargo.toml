[package]
name = "centwise-parser"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
centwise-domain = { workspace = true }
centwise-normalization = { path = "../centwise-normalization" }
centwise-categorization = { path = "../centwise-categorization" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
