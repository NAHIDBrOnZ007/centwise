name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-android-release:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: apps/android
      - name: Assemble Release / Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: apps/android
      - name: Upload Android Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: centwise-android-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

  build-ios-release:
    name: Build iOS Archive & App
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode Project
        run: xcodegen generate
        working-directory: apps/ios
      - name: Build iOS Application
        run: |
          xcodebuild -project apps/ios/Centwise.xcodeproj \
            -scheme Centwise \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath apps/ios/build \
            clean build \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload iOS Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: centwise-ios-release
          path: apps/ios/build/Build/Products/Release-iphonesimulator/Centwise.app
