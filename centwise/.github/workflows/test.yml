name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-core:
    name: Rust Core Tests & Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all --check
        working-directory: core
      - name: Clippy lint
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: core
      - name: Run tests
        run: cargo test --workspace
        working-directory: core

  android-app:
    name: Android Assemble Debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: apps/android
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: apps/android
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: centwise-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

  ios-app:
    name: iOS Project Generation & Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode Project
        run: xcodegen generate
        working-directory: apps/ios
      - name: Build iOS App
        run: |
          xcodebuild -project apps/ios/Centwise.xcodeproj \
            -scheme Centwise \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath apps/ios/build \
            clean build \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload iOS App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: centwise-ios-app
          path: apps/ios/build/Build/Products/Debug-iphonesimulator/Centwise.app
